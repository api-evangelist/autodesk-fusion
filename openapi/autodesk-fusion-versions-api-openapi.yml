  parameters:
    filter_type_version:
      name: filter[type]
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/filter_type_version_internal'
      description: Filter by the ``type`` of the ``ref`` target. Supported values include ``folders``, ``items``, and ``versions``.
    copyFrom:
      name: copyFrom
      in: query
      required: false
      schema:
        type: string
      description: "The Version ID (URN) of the version to copy from. \n\n**Note**: This parameter is relevant only for copying files to BIM 360 Docs.\n\nFor information on how to find the URN, see the initial steps of the [Download a File](/en/docs/data/v2/tutorials/download-file/) tutorial.\n\nYou can only copy files to the Plans folder or to subfolders of the Plans folder with an ``item:autodesk.bim360:Document`` item extension type. You can only copy files to the Project Files folder or to subfolders of the Project Files folder with an ``item:autodesk.bim360:File`` item extension type.  \n\nTo verify an item’s extension type, use the [Get an Item](/en/docs/data/v2/reference/http/projects-project_id-items-item_id-GET/) operation, and check the ``attributes.extension.type`` attribute.  \n\nNote that if you copy a file to the Plans folder or to a subfolder of the Plans folder, the copied file inherits the permissions of the source file. For example, if users of your app did not have permission to download files in the source folder, but does have permission to download files in the target folder, they will not be able to download the copied file.  \n\nNote that you cannot copy a file while it is being uploaded, updated, or copied. To verify the current process state of a file, call the [Get an Item](en/docs/data/v2/reference/http/projects-project_id-items-item_id-GET/) operation , and check the ``attributes.extension.data.processState`` attribute.\n"
    filter_id:
      name: filter[id]
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: Filter by the ``id`` of the ``ref`` target.
    filter_format_fileType:
      name: filter[format.fileType]
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: Filter by the file type of the download object.
    project_id:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: "The unique identifier of a project. \n\nFor BIM 360 Docs and ACC Docs, a hub ID corresponds to an Account ID. To convert a BIM 360 or ACC Account ID to a hub ID, prefix the Account ID with ``b.``. For example, an Account ID of ```c8b0c73d-3ae9``` translates to a hub ID of ``b.c8b0c73d-3ae9``.\n\nSimilarly, to convert an ACC or BIM 360 project ID to a Data Management project ID prefix the ACC or BIM 360 project ID with ``b.``. For example, a project ID of ``c8b0c73d-3ae9`` translates to a project ID of ``b.c8b0c73d-3ae9``.\n"
    x-user-id:
      name: x-user-id
      in: header
      required: false
      schema:
        type: string
      description: In a two-legged authentication context, an app has access to all users specified by the administrator in the SaaS integrations UI. By providing this header, the API call will be limited to act only on behalf of the specified user.
    filter_extension_type:
      name: filter[extension.type]
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: "Filter by the extension type. \n"
    filter_direction:
      name: filter[direction]
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/filter_direction'
      description: 'Filter by the direction of the reference. Possible values: ``from`` and ``to``.'
    version_id:
      name: version_id
      in: path
      required: true
      schema:
        type: string
      description: The URL encoded unique identifier of a version.
    filter_refType:
      name: filter[refType]
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/filter_refType'
      description: 'Filter by ``refType``. Possible values: ``derived``, ``dependencies``, ``auxiliary``, ``xrefs``, and ``includes``.'
