      properties:
        jsonapi:
          $ref: '#/components/schemas/json_api_version'
        data:
          type: object
          description: The data that describes the version to be created.
          required:
          - type
          - attributes
          - relationships
          properties:
            type:
              $ref: '#/components/schemas/type_version'
            attributes:
              type: object
              description: The properties of the version to be created.
              required:
              - name
              - extension
              properties:
                name:
                  type: string
                  description: "The file name to be used when synced to local disk (1-255 characters). \n\nAvoid using the following reserved characters in the name: ``<``, ``>``, ``:``, ``\"``, ``/``, ``\\``, ``|``, ``?``, ``*``, ``'``, ``\\n``, ``\\r``, ``\\t``, ``\\0``, ``\\f``, ``¢``, ``™``, ``$``, ``®``.\n\nIf you are creating the new version by copying an existing version of another item, the system uses the name of the source by default. However, if you specify a name, it will override the default name."
                  minLength: 1
                extension:
                  type: object
                  description: A container of additional properties that extends the default properties of the version to be created.
                  required:
                  - type
                  - version
                  properties:
                    type:
                      type: string
                      minLength: 1
                      description: The Type ID of the schema that defines the structure of the ``extension.data`` object.
                    version:
                      type: string
                      minLength: 1
                      description: The version of the schema that applies to the ``extension.data`` object.
                    data:
                      type: object
                      description: 'The container of additional properties.


                        The additional properties must follow the schema specified by ``extensions.type`` and ``extensions.version``. Properties that don''t follow the schema will be ignored.

                        '
                displayName:
                  type: string
                  description: Reserved for future use. Use ``data.attributes.name`` for the name.
            relationships:
              type: object
              description: A container of links to resources that are related to the version to be created.
              required:
              - item
              properties:
                item:
                  type: object
                  description: Contains information about the item this is a version of.
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: A container of data on the item.
                      required:
                      - type
                      - id
                      properties:
                        type:
                          $ref: '#/components/schemas/type_item'
                        id:
                          type: string
                          minLength: 1
                          description: The ID that uniquely identifies the item.
                storage:
                  type: object
                  description: Contains the information about the storage location that contains the binary data of this version.
                  properties:
                    data:
                      type: object
                      description: A container of data on the storage location.
                      required:
                      - type
                      - id
                      properties:
                        type:
                          $ref: '#/components/schemas/type_object'
                        id:
                          type: string
                          minLength: 1
                          description: The ID that uniquely identifies the storage location.
                  required:
                  - data
                refs:
                  type: object
                  description: Information on other resources that will share a custom relationship with the version being created.
                  properties:
                    data:
                      type: array
                      description: An array of object, where each object represents a reference.
                      items:
                        type: object
                        properties:
                          type:
                            $ref: '#/components/schemas/type_version'
                          id:
                            type: string
                            description: The URN (Version ID) of the referenced version.
                          meta:
                            type: object
                            description: Contains meta information about the reference.
                            required:
                            - refType
                            - direction
                            - extension
                            properties:
                              refType:
                                $ref: '#/components/schemas/reftypes_xref'
                              direction:
                                $ref: '#/components/schemas/metarefs_direction'
                              extension:
                                type: object
                                description: Contains additional properties that extend the default properties of the relationship.
                                properties:
                                  type:
                                    $ref: '#/components/schemas/extension_type_core_xref'
                                  version:
                                    type: string
                                    description: The version of the xref type. Currently must be ``1.1.0``.
                                  data:
                                    type: object
                                    properties:
                                      nestedType:
                                        $ref: '#/components/schemas/nested_xref'
                                    required:
                                    - nestedType
                        required:
                        - type
                        - id
                        - meta
                  required:
                  - data
        meta:
          $ref: '#/components/schemas/metaForWebhooks'
