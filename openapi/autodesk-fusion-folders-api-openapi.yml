      name: page[number]
      in: query
      required: false
      schema:
        type: integer
        format: int32
      description: Specifies what page to return. Page numbers are 0-based (the first page is page 0).
    project_id:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: "The unique identifier of a project. \n\nFor BIM 360 Docs and ACC Docs, a hub ID corresponds to an Account ID. To convert a BIM 360 or ACC Account ID to a hub ID, prefix the Account ID with ``b.``. For example, an Account ID of ```c8b0c73d-3ae9``` translates to a hub ID of ``b.c8b0c73d-3ae9``.\n\nSimilarly, to convert an ACC or BIM 360 project ID to a Data Management project ID prefix the ACC or BIM 360 project ID with ``b.``. For example, a project ID of ``c8b0c73d-3ae9`` translates to a project ID of ``b.c8b0c73d-3ae9``.\n"
    x-user-id:
      name: x-user-id
      in: header
      required: false
      schema:
        type: string
      description: In a two-legged authentication context, an app has access to all users specified by the administrator in the SaaS integrations UI. By providing this header, the API call will be limited to act only on behalf of the specified user.
    folder_id:
      name: folder_id
      in: path
      required: true
      schema:
        type: string
      description: The unique identifier of a folder.
    filter_direction:
      name: filter[direction]
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/filter_direction'
      description: 'Filter by the direction of the reference. Possible values: ``from`` and ``to``.'
    If-Modified-Since:
      name: If-Modified-Since
      in: header
      required: false
      schema:
        type: string
        format: date-time
      description: Specify a date in the ``YYYY-MM-DDThh:mm:ss.sz`` format. If the resource has not been modified since the specified date/time, the response will return a HTTP status of 304 without any response body; the ``Last-Modified`` response header will contain the date of last modification.
    page_limit:
      name: page[limit]
      in: query
      required: false
      schema:
        type: integer
      description: Specifies the maximum number of elements to return in the page. The default value is 200. The min value is 1. The max value is 200.
    filter_extension_type:
      name: filter[extension.type]
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: "Filter by the extension type. \n"
    filter:
      name: filter[*]
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: Filter the data. See the [Filtering](/en/docs/data/v2/overview/filtering/) section for details.
    filter_refType:
      name: filter[refType]
